[package]
name = "ocall-handler"
version = "0.1.0"
edition = "2021"

[dependencies]
sgx-types = { rev = "2a7f4c76eda41147854570d0220b86aeac5c1e2b", git = "https://github.com/datachainlab/sgx-sdk-rs" }
