[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "proxy_enclave"
crate-type = ["staticlib"]

[features]
default = ["panic-logging"]
panic-logging = [
    "enclave-runtime/panic-logging",
]

[dependencies]
enclave-runtime = { path = "../enclave-modules/runtime" }
tendermint-lc = { path = "../modules/tendermint-lc", default-features = false }

[build-dependencies]
sgx-build = { rev = "2a7f4c76eda41147854570d0220b86aeac5c1e2b", git = "https://github.com/datachainlab/sgx-sdk-rs" }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
